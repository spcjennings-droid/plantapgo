<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WayPoint</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #2D3142; color: white; text-align: center; padding: 60px 20px; min-height: 100vh; opacity: 0; transition: opacity 0.3s; }
        body.visible { opacity: 1; }
        h1 { color: #F4B942; font-size: 32px; font-weight: bold; margin-bottom: 8px; }
        .tagline { color: #aaa; font-size: 16px; margin-bottom: 40px; }
        .card { background: rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; margin: 0 auto 24px; max-width: 360px; }
        .card p { color: #ccc; font-size: 15px; line-height: 1.5; }
        .btn { display: block; margin: 10px auto; padding: 16px 28px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 16px; max-width: 280px; }
        .ios { background: #F4B942; color: #2D3142; }
        .android { background: #27AE60; color: white; }
        .footer { margin-top: 40px; color: #555; font-size: 12px; }
    </style>
    <script>
        window.onload = function() {
            var ua = navigator.userAgent.toLowerCase();
            var isAndroid = ua.indexOf('android') > -1;
            var isIOS = ua.indexOf('iphone') > -1 || ua.indexOf('ipad') > -1 || ua.indexOf('ipod') > -1;

            var deepLink = 'waypoint:/' + window.location.pathname + window.location.search;

            // Small delay before redirect so URL params are fully available
            setTimeout(function() {
                window.location.href = deepLink;
            }, 300);

            // Only show page after 2.5 seconds if WayPoint didn't open
            setTimeout(function() {
                document.body.classList.add('visible');
                document.getElementById('download').style.display = 'block';

                if (isIOS) {
                    document.getElementById('ios-btn').style.display = 'block';
                    document.getElementById('msg').textContent = 'Get WayPoint on the App Store:';
                } else if (isAndroid) {
                    document.getElementById('android-btn').style.display = 'block';
                    document.getElementById('msg').textContent = 'Get WayPoint on Google Play:';
                } else {
                    document.getElementById('ios-btn').style.display = 'block';
                    document.getElementById('android-btn').style.display = 'block';
                    document.getElementById('msg').textContent = 'Get WayPoint — available on iOS and Android:';
                }
            }, 2500);
        };
    </script>
</head>
<body>
    <h1>WayPoint</h1>
    <p class="tagline">Plan. Tap. Go.</p>

    <div id="download" style="display:none">
        <div class="card">
            <p>WayPoint isn't installed. Download it free:</p>
        </div>
        <p id="msg" style="color:#aaa; font-size:14px; margin-bottom:12px;"></p>
        <a id="ios-btn" class="btn ios" href="https://apps.apple.com/app/id000000000" style="display:none">📱 Download on App Store</a>
        <a id="android-btn" class="btn android" href="https://play.google.com/store/apps/details?id=com.spcjenn.waypoint" style="display:none">🤖 Get it on Google Play</a>
    </div>

    <div class="footer">by SpcJenn LLC — Veteran Owned 🇺🇸</div>
</body>
</html>
