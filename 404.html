<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WayPoint — Plan. Tap. Go.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #2D3142; color: white; text-align: center; padding: 60px 20px; min-height: 100vh; }
        h1 { color: #F4B942; font-size: 32px; font-weight: bold; margin-bottom: 8px; }
        .tagline { color: #aaa; font-size: 16px; margin-bottom: 40px; }
        .card { background: rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; margin: 0 auto 24px; max-width: 360px; }
        .card p { color: #ccc; font-size: 15px; line-height: 1.5; }
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(244,185,66,0.3); border-top-color: #F4B942; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn { display: block; margin: 10px auto; padding: 16px 28px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 16px; max-width: 280px; }
        .ios { background: #F4B942; color: #2D3142; }
        .android { background: #27AE60; color: white; }
        .footer { margin-top: 40px; color: #555; font-size: 12px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>WayPoint</h1>
    <p class="tagline">Plan. Tap. Go.</p>

    <div id="loading" class="card">
        <div class="spinner"></div>
        <p>Opening WayPoint...</p>
    </div>

    <div id="download" class="hidden">
        <div class="card">
            <p>WayPoint isn't installed or couldn't open automatically.</p>
        </div>
        <p id="download-msg" style="color:#aaa; font-size:14px; margin-bottom:12px;"></p>
        <a id="ios-btn" class="btn ios hidden" href="https://apps.apple.com/app/id000000000">📱 Download on App Store</a>
        <a id="android-btn" class="btn android hidden" href="https://play.google.com/store/apps/details?id=com.spcjenn.waypoint">🤖 Get it on Google Play</a>
    </div>

    <div class="footer">by SpcJenn LLC — Veteran Owned 🇺🇸</div>

    <script>
        // Detect device
        var ua = navigator.userAgent;
        var isAndroid = /android/i.test(ua);
        var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

        // Build deep link preserving full URL including all query params
        var deepLink = 'waypoint:/' + window.location.pathname + window.location.search;

        // Redirect to WayPoint
        window.location.href = deepLink;

        // After 2 seconds show download buttons
        setTimeout(function() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('download').classList.remove('hidden');

            if (isAndroid) {
                document.getElementById('download-msg').textContent = 'Get WayPoint on Google Play:';
                document.getElementById('android-btn').classList.remove('hidden');
            } else if (isIOS) {
                document.getElementById('download-msg').textContent = 'Get WayPoint on the App Store:';
                document.getElementById('ios-btn').classList.remove('hidden');
            } else {
                document.getElementById('download-msg').textContent = 'Get WayPoint — available on iOS and Android:';
                document.getElementById('ios-btn').classList.remove('hidden');
                document.getElementById('android-btn').classList.remove('hidden');
            }
        }, 2000);
    </script>
</body>
</html>
